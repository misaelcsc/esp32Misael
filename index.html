<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoramento IoT | Nível de Água</title>
    <!-- Importação da biblioteca MQTT.js via CDN -->
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    
    <style>
        /* Estrutura CSS moderna e responsiva */
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --primary-color: #2563eb;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --success: #10b981;
            --danger: #ef4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--text-main);
        }

        .dashboard-container {
            background-color: var(--card-bg);
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 500px;
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .header h1 {
            font-size: 1.5rem;
            color: var(--text-main);
            margin-bottom: 0.5rem;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            background-color: #fee2e2;
            color: var(--danger);
            transition: all 0.3s ease;
        }

        .status-badge.connected {
            background-color: #d1fae5;
            color: var(--success);
        }

        .data-card {
            background-color: var(--bg-color);
            padding: 1.5rem;
            border-radius: 12px;
            margin-bottom: 1.5rem;
            text-align: center;
        }

        .data-label {
            font-size: 0.9rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.5rem;
        }

        .data-value {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--primary-color);
        }

        .progress-container {
            width: 100%;
            height: 24px;
            background-color: #e5e7eb;
            border-radius: 12px;
            overflow: hidden;
            margin-top: 1rem;
        }

        .progress-bar {
            height: 100%;
            background-color: var(--primary-color);
            width: 0%;
            transition: width 0.5s ease-in-out;
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <div class="header">
            <h1>Monitoramento do Tanque</h1>
            <div id="connection-status" class="status-badge">Desconectado</div>
        </div>

        <div class="data-card">
            <div class="data-label">Distância Medida</div>
            <div id="distancia-val" class="data-value">-- cm</div>
        </div>

        <div class="data-card">
            <div class="data-label">Nível / Porcentagem</div>
            <div id="porcentagem-val" class="data-value">-- %</div>
            <div class="progress-container">
                <div id="progress-bar" class="progress-bar"></div>
            </div>
        </div>
    </div>

    <script>
        // Configurações do HiveMQ Cloud (WebSockets)
        // Note o uso do protocolo wss:// e a porta 8884
        const brokerUrl = 'wss://e536773ffa2d47a8a7daf222d737185b.s1.eu.hivemq.cloud:8884/mqtt';
        
        const options = {
            clientId: 'web_client_' + Math.random().toString(16).substring(2, 8),
            username: 'medAgua',
            password: '12345678',
            clean: true,
            connectTimeout: 4000,
            reconnectPeriod: 1000,
        };

        // Elementos do DOM
        const statusEl = document.getElementById('connection-status');
        const distanciaEl = document.getElementById('distancia-val');
        const porcentagemEl = document.getElementById('porcentagem-val');
        const progressBarEl = document.getElementById('progress-bar');

        // Inicializa a conexão
        console.log('Tentando conectar ao broker MQTT via WebSockets...');
        const client = mqtt.connect(brokerUrl, options);

        // Evento de conexão bem-sucedida
        client.on('connect', () => {
            console.log('Conectado com sucesso!');
            statusEl.textContent = 'Conectado ao Broker';
            statusEl.classList.add('connected');
            
            // Inscreve nos tópicos
            client.subscribe('sensor/medAgua/distancia');
            client.subscribe('sensor/medAgua/porcentagem');
        });

        // Evento de perda de conexão
        client.on('offline', () => {
            statusEl.textContent = 'Desconectado';
            statusEl.classList.remove('connected');
        });

        // Recebimento de mensagens
        client.on('message', (topic, message) => {
            const payload = message.toString();
            console.log(`Recebido no tópico ${topic}: ${payload}`);

            if (topic === 'sensor/medAgua/distancia') {
                distanciaEl.textContent = `${payload} cm`;
            } 
            else if (topic === 'sensor/medAgua/porcentagem') {
                porcentagemEl.textContent = `${payload} %`;
                // Atualiza a barra de progresso garantindo que fique entre 0 e 100
                const percentValue = Math.min(Math.max(parseFloat(payload), 0), 100);
                progressBarEl.style.width = `${percentValue}%`;
            }
        });
    </script>
</body>
</html>
