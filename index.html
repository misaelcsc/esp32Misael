<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel IoT - ESP32</title>
    <!-- Importação da biblioteca Paho MQTT para WebSockets -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #e9ecef;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #333;
        }

        .card {
            background-color: #ffffff;
            padding: 2.5rem 2rem;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
            text-align: center;
            width: 100%;
            max-width: 380px;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
            color: #2c3e50;
        }

        .status-box {
            background-color: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
        }

        .status-label {
            font-size: 1.2rem;
            font-weight: 600;
        }

        /* O círculo que simula o LED */
        .led-indicator {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background-color: #ccc; /* Cor padrão (desconectado/desconhecido) */
            transition: all 0.3s ease;
        }

        .led-on {
            background-color: #2ecc71;
            box-shadow: 0 0 12px #2ecc71;
        }

        .led-off {
            background-color: #e74c3c;
            box-shadow: 0 0 12px #e74c3c;
        }

        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        button {
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            color: white;
            transition: transform 0.1s, opacity 0.2s;
            flex: 1;
        }

        button:active {
            transform: scale(0.96);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-on {
            background-color: #2ecc71;
        }

        .btn-off {
            background-color: #e74c3c;
        }

        #connection-status {
            margin-top: 1.5rem;
            font-size: 0.85rem;
            color: #f39c12; /* Laranja para 'Conectando...' */
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Controle do ESP32</h1>
        
        <div class="status-box">
            <span class="status-label">Status do LED:</span>
            <div id="led-indicator" class="led-indicator"></div>
        </div>

        <div class="controls">
            <button id="btn-on" class="btn-on" onclick="sendControl('ON')" disabled>LIGAR</button>
            <button id="btn-off" class="btn-off" onclick="sendControl('OFF')" disabled>DESLIGAR</button>
        </div>

        <div id="connection-status">Conectando ao Broker MQTT...</div>
    </div>

    <script>
        // ==========================================
        // CONFIGURAÇÕES DO HIVEMQ CLOUD (WEBSOCKETS)
        // ==========================================
        const mqttServer = "e536773ffa2d47a8a7daf222d737185b.s1.eu.hivemq.cloud";
        const mqttPort = 8884; // Porta para WebSockets (TLS)
        const mqttPath = "/mqtt";
        const mqttUser = "espMisael"; // Substitua pelo seu usuário
        const mqttPass = "Agua1234";   // Substitua pela sua senha
        
        const topicControl = "esp32/led/control";
        const topicStatus = "esp32/led/status";

        // Gera um ID de cliente aleatório para o navegador
        const clientId = "WebClient-" + Math.random().toString(16).substr(2, 8);

        // Instancia o cliente Paho MQTT
        const client = new Paho.MQTT.Client(mqttServer, mqttPort, mqttPath, clientId);

        // Callbacks
        client.onConnectionLost = onConnectionLost;
        client.onMessageArrived = onMessageArrived;

        // Opções de conexão (Requer SSL/TLS para o HiveMQ Cloud)
        const options = {
            useSSL: true,
            userName: mqttUser,
            password: mqttPass,
            onSuccess: onConnect,
            onFailure: function(message) {
                document.getElementById("connection-status").innerText = "Falha na conexão: " + message.errorMessage;
                document.getElementById("connection-status").style.color = "#e74c3c";
            }
        };

        // Inicia a conexão
        client.connect(options);

        // Quando conectar com sucesso
        function onConnect() {
            console.log("Conectado ao HiveMQ via WebSocket!");
            
            let statusText = document.getElementById("connection-status");
            statusText.innerText = "🟢 Conectado ao Broker";
            statusText.style.color = "#2ecc71";

            // Habilita os botões
            document.getElementById("btn-on").disabled = false;
            document.getElementById("btn-off").disabled = false;

            // Inscreve no tópico de status para ouvir as respostas do ESP32
            client.subscribe(topicStatus);
        }

        // Quando a conexão cair
        function onConnectionLost(responseObject) {
            if (responseObject.errorCode !== 0) {
                console.log("Conexão perdida: " + responseObject.errorMessage);
                
                let statusText = document.getElementById("connection-status");
                statusText.innerText = "🔴 Desconectado";
                statusText.style.color = "#e74c3c";

                // Desabilita os botões
                document.getElementById("btn-on").disabled = true;
                document.getElementById("btn-off").disabled = true;
                
                // Reseta o indicador visual
                document.getElementById("led-indicator").className = "led-indicator";
            }
        }

        // Quando receber uma mensagem do ESP32
        function onMessageArrived(message) {
            console.log("Mensagem recebida no tópico " + message.destinationName + ": " + message.payloadString);
            
            if (message.destinationName === topicStatus) {
                let payload = message.payloadString.trim().toUpperCase();
                let ledElement = document.getElementById("led-indicator");

                // Atualiza o CSS do indicador baseado no status retornado pelo ESP32
                if (payload === "ON" || payload === "1") {
                    ledElement.className = "led-indicator led-on";
                } else if (payload === "OFF" || payload === "0") {
                    ledElement.className = "led-indicator led-off";
                }
            }
        }

        // Função para enviar o comando de controle ao clicar nos botões
        function sendControl(command) {
            if (client.isConnected()) {
                let message = new Paho.MQTT.Message(command);
                message.destinationName = topicControl;
                client.send(message);
                console.log("Enviado comando: " + command);
            }
        }
    </script>
</body>
</html>
